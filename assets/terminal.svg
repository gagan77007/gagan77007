<svg xmlns="http://www.w3.org/2000/svg"
    width="1000"
    height="155"
    viewBox="0 0 1000 155">

    <defs>

      <linearGradient id="border"
        x1="0" y1="0" x2="1" y2="1">

        <stop offset="0%" stop-color="#00F5FF"/>
        <stop offset="50%" stop-color="#4263EB"/>
        <stop offset="100%" stop-color="#A855F7"/>

      </linearGradient>

      <linearGradient id="panel"
        x1="0" y1="0" x2="1" y2="1">

        <stop offset="0%" stop-color="#101C35"/>
        <stop offset="100%" stop-color="#080D20"/>

      </linearGradient>

      <filter id="glow"
        x="-30%" y="-30%" width="160%" height="160%">

        <feGaussianBlur stdDeviation="2.5"
          result="blur"/>

        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>

      </filter>

    </defs>

    <rect
      x="5"
      y="5"
      width="990"
      height="145"
      rx="18"
      fill="url(#panel)"
      stroke="url(#border)"
      stroke-width="2"
      filter="url(#glow)"
    />

    

    <circle cx="32" cy="28" r="6" fill="#FF5F57"/>
    <circle cx="52" cy="28" r="6" fill="#FEBC2E"/>
    <circle cx="72" cy="28" r="6" fill="#28C840"/>

    <text x="100" y="33"
      fill="#8FA3C8"
      font-size="13"
      font-family="monospace">

      gagan@developer:~

    </text>

    <text x="35" y="76"
      fill="#00F5FF"
      font-size="18"
      font-family="monospace">

      $ whoami

    </text>

    <text x="35" y="110"
      fill="#EAFBFF"
      font-size="17"
      font-family="monospace">

      Full Stack Developer | Tech Enthusiast

    </text>

    <rect x="690" y="94"
      width="9"
      height="19"
      fill="#00F5FF">

      <animate
        attributeName="opacity"
        values="1;0;1"
        dur="1.2s"
        repeatCount="indefinite"/>

    </rect>

    </svg>