<svg xmlns="http://www.w3.org/2000/svg"
    width="1000" height="190" viewBox="0 0 1000 190">

    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#07111F"/>
            <stop offset="55%" stop-color="#101B38"/>
            <stop offset="100%" stop-color="#24164A"/>
        </linearGradient>

        <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#00F5FF"/>
            <stop offset="50%" stop-color="#7C3AED"/>
            <stop offset="100%" stop-color="#00F5FF"/>
        </linearGradient>

        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="5" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <rect width="1000" height="190" rx="22" fill="url(#bg)"/>

    <rect x="4" y="4" width="992" height="182"
        rx="19" fill="none"
        stroke="url(#border)" stroke-width="2"
        filter="url(#glow)"/>
    
    <rect x="20" y="12" width="960" height="166"
        rx="16" fill="#0B1730"
        stroke="#263B68" stroke-width="1.2"/>
    
    <text x="50" y="48" fill="#00F5FF"
        font-family="JetBrains Mono, Consolas, monospace"
        font-size="19" font-weight="bold">
        02  /  DEVELOPER TERMINAL
    </text>
    
    <circle cx="920" cy="39" r="5" fill="#FB7185"/>
    <circle cx="940" cy="39" r="5" fill="#FACC15"/>
    <circle cx="960" cy="39" r="5" fill="#4ADE80"/>
    
    <text x="55" y="76" fill="#7CFC8A"
        font-family="JetBrains Mono, Consolas, monospace"
        font-size="12" font-weight="normal">
        $ whoami
    </text>
    
    <text x="55" y="93" fill="#EAFBFF"
        font-family="JetBrains Mono, Consolas, monospace"
        font-size="12" font-weight="normal">
        Gagan Reddy — Developer
    </text>
    
    <text x="55" y="110" fill="#7CFC8A"
        font-family="JetBrains Mono, Consolas, monospace"
        font-size="12" font-weight="normal">
        $ current_focus
    </text>
    
    <text x="55" y="127" fill="#EAFBFF"
        font-family="JetBrains Mono, Consolas, monospace"
        font-size="12" font-weight="normal">
        Learning • Building • Creating
    </text>
    
    <text x="55" y="144" fill="#7CFC8A"
        font-family="JetBrains Mono, Consolas, monospace"
        font-size="12" font-weight="normal">
        $ status
    </text>
    
    <text x="55" y="161" fill="#A78BFA"
        font-family="JetBrains Mono, Consolas, monospace"
        font-size="12" font-weight="normal">
        Always exploring new ideas...
    </text>
    
</svg>