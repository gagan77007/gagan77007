<svg xmlns="http://www.w3.org/2000/svg"
    width="1000" height="170" viewBox="0 0 1000 170">

    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#07111F"/>
            <stop offset="55%" stop-color="#101B38"/>
            <stop offset="100%" stop-color="#24164A"/>
        </linearGradient>

        <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#00F5FF"/>
            <stop offset="50%" stop-color="#7C3AED"/>
            <stop offset="100%" stop-color="#00F5FF"/>
        </linearGradient>

        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="5" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <rect width="1000" height="170" rx="22" fill="url(#bg)"/>

    <rect x="4" y="4" width="992" height="162"
        rx="19" fill="none"
        stroke="url(#border)" stroke-width="2"
        filter="url(#glow)"/>
    
    <rect x="20" y="12" width="960" height="146"
        rx="16" fill="#0B1730"
        stroke="#263B68" stroke-width="1.2"/>
    
    <text x="50" y="52" fill="#00F5FF"
        font-family="JetBrains Mono, Consolas, monospace"
        font-size="21" font-weight="bold">
        01  /  ABOUT ME
    </text>
    
    <text x="50" y="91" fill="#EAFBFF"
        font-family="JetBrains Mono, Consolas, monospace"
        font-size="15" font-weight="normal">
        Developer | Technology Enthusiast
    </text>
    
    <text x="50" y="123" fill="#A8B8D8"
        font-family="JetBrains Mono, Consolas, monospace"
        font-size="14" font-weight="normal">
        Learning • Building • Creating
    </text>
    
    <text x="50" y="146" fill="#A78BFA"
        font-family="JetBrains Mono, Consolas, monospace"
        font-size="12" font-weight="normal">
        GITHUB.COM/GAGAN77007
    </text>
    
</svg>