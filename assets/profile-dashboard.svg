<svg xmlns="http://www.w3.org/2000/svg"
    width="1000"
    height="210"
    viewBox="0 0 1000 210">

    <defs>

      <linearGradient id="border"
        x1="0" y1="0" x2="1" y2="1">

        <stop offset="0%" stop-color="#00F5FF"/>
        <stop offset="50%" stop-color="#4263EB"/>
        <stop offset="100%" stop-color="#A855F7"/>

      </linearGradient>

      <linearGradient id="panel"
        x1="0" y1="0" x2="1" y2="1">

        <stop offset="0%" stop-color="#101C35"/>
        <stop offset="100%" stop-color="#080D20"/>

      </linearGradient>

      <filter id="glow"
        x="-30%" y="-30%" width="160%" height="160%">

        <feGaussianBlur stdDeviation="2.5"
          result="blur"/>

        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>

      </filter>

    </defs>

    <rect
      x="5"
      y="5"
      width="990"
      height="200"
      rx="18"
      fill="url(#panel)"
      stroke="url(#border)"
      stroke-width="2"
      filter="url(#glow)"
    />

    

    <text x="35" y="45"
      fill="#00F5FF"
      font-size="20"
      font-weight="bold"
      font-family="Arial">

      DEVELOPER PROFILE

    </text>

    <text x="35" y="76"
      fill="#DCEBFF"
      font-size="14"
      font-family="Arial">

      Building, learning and exploring technology.

    </text>

    

