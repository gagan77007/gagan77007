<svg xmlns="http://www.w3.org/2000/svg"
    width="1000" height="230"
    viewBox="0 0 1000 230">

    <defs>

      <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#00F5FF"/>
        <stop offset="50%" stop-color="#4263EB"/>
        <stop offset="100%" stop-color="#D946EF"/>
      </linearGradient>

      <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#00F5FF"/>
        <stop offset="100%" stop-color="#D946EF"/>
      </linearGradient>

      <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#10172C"/>
        <stop offset="100%" stop-color="#030713"/>
      </linearGradient>

      <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="2.5" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>

    </defs>

    <rect width="1000" height="230" fill="#030713"/>
    
    <text text-anchor="middle" x="500" y="35"
      fill="#91DFFF"
      font-size="14"
      font-weight="normal"
      font-family="Arial, sans-serif">
      // DEVELOP • BUILD • INNOVATE
    </text>
    
    <path d="M170 65 H215 M170 65 V115 M830 65 H785 M830 65 V115"
      fill="none" stroke="url(#neon)" stroke-width="3"
      filter="url(#glow)"/>

    <text x="500" y="125"
      text-anchor="middle"
      font-size="65"
      font-weight="bold"
      font-family="Arial"
      fill="url(#title)"
      filter="url(#glow)">
      GAGAN REDDY
    </text>

    <text x="500" y="165"
      text-anchor="middle"
      font-size="20"
      letter-spacing="6"
      fill="#00F5FF"
      font-family="Arial">
      DEVELOPER
    </text>
    
    <text text-anchor="middle" x="500" y="205"
      fill="#B8C8E6"
      font-size="13"
      font-weight="normal"
      font-family="Arial, sans-serif">
      BUILDING IDEAS INTO REALITY  •  LEARNING EVERY DAY
    </text>
    
</svg>