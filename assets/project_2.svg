<svg xmlns="http://www.w3.org/2000/svg"
    width="1000" height="150" viewBox="0 0 1000 150">

    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#07111F"/>
            <stop offset="55%" stop-color="#101B38"/>
            <stop offset="100%" stop-color="#24164A"/>
        </linearGradient>

        <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#00F5FF"/>
            <stop offset="50%" stop-color="#7C3AED"/>
            <stop offset="100%" stop-color="#00F5FF"/>
        </linearGradient>

        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="5" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <rect width="1000" height="150" rx="22" fill="url(#bg)"/>

    <rect x="4" y="4" width="992" height="142"
        rx="19" fill="none"
        stroke="url(#border)" stroke-width="2"
        filter="url(#glow)"/>
    
    <rect x="15" y="12" width="970" height="126"
        rx="16" fill="#0B1730"
        stroke="#263B68" stroke-width="1.2"/>
    
    <text x="40" y="49" fill="#00F5FF"
        font-family="JetBrains Mono, Consolas, monospace"
        font-size="18" font-weight="bold">
        02  /  shopdirect-ordering-app
    </text>
    
    <text x="40" y="80" fill="#EAFBFF"
        font-family="JetBrains Mono, Consolas, monospace"
        font-size="13" font-weight="normal">
        Complete mobile-first single-shop ordering and store management web app built with React, HTML,
    </text>
    
    <text x="40" y="111" fill="#A78BFA"
        font-family="JetBrains Mono, Consolas, monospace"
        font-size="12" font-weight="normal">
        TECH  /  TypeScript
    </text>
    
</svg>