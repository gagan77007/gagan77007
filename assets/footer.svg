<svg xmlns="http://www.w3.org/2000/svg"
    width="1000" height="160"
    viewBox="0 0 1000 160">

    <defs>

      <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#00F5FF"/>
        <stop offset="50%" stop-color="#4263EB"/>
        <stop offset="100%" stop-color="#D946EF"/>
      </linearGradient>

      <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#00F5FF"/>
        <stop offset="100%" stop-color="#D946EF"/>
      </linearGradient>

      <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#10172C"/>
        <stop offset="100%" stop-color="#030713"/>
      </linearGradient>

      <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="2.5" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>

    </defs>

    <rect width="1000" height="160" fill="#030713"/>
    
    <rect x="20" y="10"
      width="960" height="140"
      rx="15"
      fill="url(#panel)"
      stroke="url(#neon)"
      stroke-width="1.5"/>
    
    <text text-anchor="middle" x="500" y="65"
      fill="#00F5FF"
      font-size="23"
      font-weight="bold"
      font-family="Arial, sans-serif">
      LET&#x27;S CONNECT
    </text>
    
    <text text-anchor="middle" x="500" y="100"
      fill="#EAFBFF"
      font-size="14"
      font-weight="normal"
      font-family="Arial, sans-serif">
      THANK YOU FOR VISITING MY PROFILE
    </text>
    
    <text text-anchor="middle" x="500" y="125"
      fill="#AABBD5"
      font-size="11"
      font-weight="normal"
      font-family="Arial, sans-serif">
      Designed with passion • Built with code
    </text>
    
</svg>